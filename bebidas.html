<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bebidas</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Bebidas</h1>
    <nav class="navbar">
      <ul class="nav-links">
        <div class="logo">Minha Lanchonete</div>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="cardapio.html">Cardapio</a></li>
        <li><a href="sobre.html">Sobre Nós</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>

    <div class="pagina-conteudo">
      <div id="container-Carrinho"></div>

      <div class="Bebidas">
        <div class="produto-card">
          <h2>Coca-Cola 2L</h2>
          <span>Preço R$ 10,99</span>
          <button
            class="btn-adicionar"
            data-nome="Coca-Cola"
            data-preco="10.99"
          >
            Adicionar ao carrinho
          </button>
        </div>
        <div class="produto-card">
          <h2>Fanta 2L</h2>
          <span>Preço R$ 10,99</span>
          <button class="btn-adicionar" data-nome="Fanta" data-preco="10.99">
            Adicionar ao carrinho
          </button>
        </div>
        <div class="produto-card">
          <h2>Suco de Laranja 1L</h2>
          <span>Preço R$ 9,99</span>
          <button
            class="btn-adicionar"
            data-nome="Suco de Laranja"
            data-preco="9.99"
          >
            Adicionar ao carrinho
          </button>
        </div>
        <div class="produto-card">
          <h2>Agua Mineral</h2>
          <span>Preço R$ 4,99</span>
          <button
            class="btn-adicionar"
            data-nome="Agua Mineral"
            data-preco="4.99"
          >
            Adicionar ao carrinho
          </button>
        </div>
        <a href="cardapio.html" class="voltar-link">Voltar para o cardápio</a>
      </div>
    </div>
    <script src="carrinho.js"></script>
  </body>
</html>
